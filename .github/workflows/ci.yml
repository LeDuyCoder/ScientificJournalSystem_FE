name: CI

on:
  push:
    branches:
      - main
      - dev
      - feat/CI_CD-action

  pull_request:
    branches:
      - main
      - dev
      - feat/CI_CD-action

jobs:
  build-and-test:
    name: Build and Test
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_ORIGIN_URL: ${{ secrets.VITE_ORIGIN_URL }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test --if-present


  docker:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ghcr.io/leduycoder/scientificjournalsystem-fe:latest
            ghcr.io/leduycoder/scientificjournalsystem-fe:${{ github.sha }}

          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_ORIGIN_URL=${{ secrets.VITE_ORIGIN_URL }}


  deploy:
    name: Deploy to VPS
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd ~/apps/researchpulse-fe

            echo "Pull latest Docker image..."
            docker-compose pull frontend

            echo "Recreate frontend container..."
            docker-compose up -d --force-recreate frontend

            echo "Remove unused images..."
            docker image prune -f