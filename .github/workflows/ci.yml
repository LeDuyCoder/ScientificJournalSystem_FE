name: CI

on:
  push:
    branches: [ "main", "master", "feat/CI_CD-action" ]
  pull_request:
    branches: [ "main", "master", "feat/CI_CD-action" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build
      
    - name: Run Tests
      # Sử dụng --if-present để bỏ qua nếu bạn chưa cấu hình script "test" trong package.json
      run: npm run test --if-present
